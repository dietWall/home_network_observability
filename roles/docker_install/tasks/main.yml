- name: Install required system packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true
  become: true
  # become_user: your_user

- name: Add Docker repository (using DEB822 format)
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: stable
    architectures: amd64
    signed_by: https://download.docker.com/linux/ubuntu/gpg
    state: present
    install_python_debian: true
  become: true

- name: Update apt cache explicitly
  ansible.builtin.apt:
    update_cache: true
  become: true

- name: Install Docker Engine and CLI
  ansible.builtin.apt:
    name: "{{ docker_install_base_packages + docker_install_additional_packages }}"
    state: present
  become: true

- name: Enable and start Docker service
  # Make sure the service is activated
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started
  become: true

#####################
# user configuration:
#####################

- name: Ensure docker group exists
  ansible.builtin.group:
    name: docker
    state: present
  become: true

- name: Add ansible user to docker group
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true
  become: true

# Changes take only effects in a new shell
# otherwise the verification steps might fail
- name: Reset connection so user group changes take effect
  ansible.builtin.meta: reset_connection

- name: Verify Docker installation
  ansible.builtin.command: docker --version
  changed_when: false
  register: docker_install_version_output

- name: Display Docker version
  ansible.builtin.debug:
    var: docker_install_version_output.stdout
