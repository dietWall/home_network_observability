---
- name: Externe Vault-Variablen für Grafana laden
  ansible.builtin.include_vars:
    file: "{{ lookup('ansible.builtin.env', 'MOLECULE_HOST_VARS_DIR') }}/{{ inventory_hostname }}/grafana_vault.yml"

- name: Install required system packages
  ansible.builtin.apt:
    name:
      - python3-docker  # Required for community.docker module
    state: present
    update_cache: true
  become: true

- name: Pull Grafana Docker image
  ansible.builtin.command:
    cmd: docker pull grafana/grafana:latest
  register: grafana_docker_pull_result
  changed_when: "'Installing' in grafana_docker_pull_result.stdout or 'Downloaded newer image' in grafana_docker_pull_result.stdout"
  until: grafana_docker_pull_result is success
  retries: 3
  delay: 10

- name: Ensure Grafana host directories exist with correct permissions
  ansible.builtin.file:
    path: "{{ item.host_path }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: '0755'
  become: true
  loop: "{{ grafana_docker_volumes }}"

- name: Create env file on host, modify with pw
  ansible.builtin.template:
    src: grafana.env.j2
    dest: "/opt/grafana/grafana.env"
    owner: root
    group: root
    mode: '0600' # Nur root darf die Passwörter lesen
  become: true
  notify: Restart Grafana service

- name: Copy Grafana datasource provisioning configuration
  ansible.builtin.template:
    src: datasources.yml.j2
    dest: "{{ grafana_docker_datasources_volume.host_path }}/monitoring_sources.yml"
    owner: "472"
    group: "472"
    mode: '0640'
  become: true
  notify: Restart Grafana service

- name: Copy Grafana systemd unit file
  ansible.builtin.template:
    src: grafana.service.j2
    dest: /etc/systemd/system/grafana.service
    owner: root
    group: root
    mode: '0644'
    backup: true
  become: true
  notify: Restart Grafana service

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true
  become: true

- name: Enable and start Grafana systemd service
  ansible.builtin.systemd:
    name: grafana
    enabled: true
    state: started
  become: true

- name: "Flush handlers: restarts imediately"
  ansible.builtin.meta: flush_handlers

- name: Verify Grafana container is running
  community.docker.docker_container_info:
    name: grafana
  register: grafana_docker_running
  until: grafana_docker_running.exists and grafana_docker_running.container.State.Running
  retries: 10
  delay: 1

- name: Wait for Grafana web interface to become active
  ansible.builtin.uri:
    url: "http://localhost:3000"
    status_code: [200, 302]
  register: grafana_docker_health
  until: grafana_docker_health.status == 200 or grafana_docker_health.status == 302
  retries: 30
  delay: 1

- name: Display Grafana health status
  ansible.builtin.debug:
    msg:
      - "Grafana is up and healthy!"
      - "HTTP Status Code: {{ grafana_docker_health.status }}"
      - "Attempts: {{ grafana_docker_health.attempts }} seconds to reach stable state"

# ====================================================================
# API-ABFRAGEN: Jetzt mit dynamischen Vault-Variablen statt "admin"
# ====================================================================
- name: Abfrage der registrierten Datenquellen via Grafana API
  ansible.builtin.uri:
    url: "http://localhost:3000/api/datasources"
    method: GET
    user: "{{ vault_grafana_admin_user }}"
    password: "{{ vault_grafana_admin_password }}"
    force_basic_auth: true
    status_code: 200
  register: grafana_api_datasources

- name: Verbindung zu jeder Datenquelle prüfen (Health Check)
  ansible.builtin.uri:
    url: "http://localhost:3000/api/datasources/uid/{{ item.uid }}/health"
    method: GET
    user: "{{ vault_grafana_admin_user }}"
    password: "{{ vault_grafana_admin_password }}"
    force_basic_auth: true
    status_code: 200
  register: datasource_health_results
  failed_when: false
  loop: "{{ grafana_api_datasources.json }}"
  loop_control:
    label: "{{ item.name }}"

- name: Ergebnis der Verbindungstests ausgeben oder warnen
  ansible.builtin.debug:
    msg: >-
      {% if item.json is defined and item.json.status == 'success' %}
      Datenquelle '{{ item.item.name }}' ist ERREICHBAR ({{ item.json.message }}).
      {% else %}
      [WARNUNG] Datenquelle '{{ item.item.name }}' ist NICHT ERREICHBAR oder antwortet mit Fehlern!
      {% endif %}
  loop: "{{ datasource_health_results.results }}"
  loop_control:
    label: "{{ item.item.name }}"
