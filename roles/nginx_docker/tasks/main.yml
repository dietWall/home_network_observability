---
# Install required system packages for docker
- name: Install required system packages
  ansible.builtin.apt:
    name:
      - python3-docker  # Required for community.docker module
    state: present
    update_cache: true
  become: true

- name: Pull Nginx Docker image
  ansible.builtin.command:
    cmd: docker pull {{ nginx_docker_image }}
  changed_when: not docker_pull_result.changed
  register: docker_pull_result

- name: Ensure nginx host directories exist with correct permissions
  ansible.builtin.file:
    path: "{{ item.host_path }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: '0755'
  become: true
  loop: "{{ nginx_docker_templates_volume }}"

- name: Create nginx systemd unit file
  ansible.builtin.template:
    src: nginx.service.j2
    dest: "{{ nginx_docker_systemd_unit_path }}"
    owner: root
    group: root
    mode: '0644'
    backup: true
  become: true
  notify: Restart Nginx service

# we are checking the results below
# lets make sure the changes are applied
- name: Flush handlers to apply Nginx configuration changes immediately
  ansible.builtin.meta: flush_handlers

- name: Enable Service
  block:
    - name: Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: true
      become: true

    - name: Enable and start Nginx systemd service
      ansible.builtin.systemd:
        name: nginx
        enabled: true
        state: started
      become: true

    - name: Verify Nginx container is running
      community.docker.docker_container_info:
        name: nginx
      register: result
      until: result.exists and result.container.State.Running
      retries: 10
      delay: 1
  rescue:
    - name: Hole Systemd Status
      ansible.builtin.command: "systemctl status {{ ansible_failed_task.args.name }}"
      register: nginx_docker_systemd_status_output
      ignore_errors: true
      changed_when: false

    - name: Hole Journalctl Logs der Unit
      ansible.builtin.command: "journalctl -u {{ ansible_failed_task.args.name }} -n 20 --no-pager"
      register: nginx_docker_journalctl_output
      ignore_errors: true
      changed_when: false

    - name: Abbruch und Log-Anzeige
      ansible.builtin.fail:
        msg: |
          ### FEHLER IN UNIT {{ ansible_failed_task.args.name }} ###
          === SYSTEMCTL STATUS ===
          {{ nginx_docker_systemd_status_output.stdout }}
          === JOURNALCTL LOGS ===
          {{ nginx_docker_journalctl_output.stdout | default('Keine Log-Ausgabe') }}

- name: Wait for Nginx web interface to become active
  ansible.builtin.uri:
    url: "http://localhost/"
    status_code: [200, 302, 403]
  register: nginx_health
  # Accepts 200, 302 for nginx, 403 if rate limiting or config error
  until: nginx_health.status == 200 or nginx_health.status == 302 or nginx_health.status == 403
  retries: 30
  delay: 1

- name: Display Nginx health status
  ansible.builtin.debug:
    msg:
      - "Nginx is up and healthy!"
      - "HTTP Status Code: {{ nginx_health.status }}"
      - "Attempts: {{ nginx_health.attempts }} seconds to reach stable state"
