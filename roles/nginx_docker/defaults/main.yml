---
# Default variables for nginx_docker role

nginx_docker_image: "nginx:alpine"
nginx_docker_container_name: "nginx"
nginx_docker_config_dir: "/etc/nginx"
nginx_docker_host_config_path: "/opt/nginx"
nginx_docker_host_logs_path: "/var/log/nginx"

# Nginx configuration templates
nginx_docker_templates_volume:
  - host_path: "/opt/nginx/templates"
    container_path: "/etc/nginx/templates"
    owner: "101"  # www-data UID
    group: "101"
    mode: "0755"

# Systemd service configuration
nginx_docker_systemd_unit_path: "/etc/systemd/system/nginx.service"

# Ports to expose
nginx_docker_ports:
  - container_port: 80
    host_port: 80
