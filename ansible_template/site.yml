---
# Main playbook for infrastructure provisioning (ansible_foundation)
- name: "Phase 1: Generate and distribute SSH keys"
  hosts: all
  gather_facts: false
  become: true
  roles:
    - role: ssh_keys

- name: "Phase 2: Gather system facts and run demo"
  hosts: all
  gather_facts: true
  roles:
    - role: demo
