# roles/demo/molecule/ubuntu26_ssh/prepare.yml
---
- name: Prepare Target - Initial Key Deployment via Password and SSH
  hosts: all
  gather_facts: false

  vars:
    ansible_host: 127.0.0.1
    ansible_port: 2222
    ansible_connection: ssh
    ansible_password: "{{ vault_password }}"
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -o PubkeyAuthentication=no'

  pre_tasks:
    - name: "Load inventory vault variables"
      ansible.builtin.include_vars:
        file: "{{ lookup('env', 'MOLECULE_HOST_VARS_DIR') }}/{{ inventory_hostname }}/vault.yml"

    # Inventory uses: vault_become_pw, which is defined in the vault
    # If the inventory is loaded before the vault, ansible fails due to missing references
    - name: "Load inventory variables"
      ansible.builtin.include_vars:
        file: "{{ lookup('env', 'MOLECULE_HOST_VARS_DIR') }}/{{ inventory_hostname }}/{{ inventory_hostname }}.yml"
        name: real_host_vars

  tasks:
    # nothing to do as of now
    # This is just a template, add your functions
